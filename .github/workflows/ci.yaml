name: CI

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/the-episerve-consortium/sync-ckan-with-lakefs:${{ github.sha }}
            ghcr.io/the-episerve-consortium/sync-ckan-with-lakefs:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Deploy to Prefect
        run: python deploy.py
        env:
          PREFECT_API_URL:    ${{ secrets.PREFECT_API_URL }}
          PREFECT_API_KEY:    ${{ secrets.PREFECT_API_KEY }}
          CKAN_API_TOKEN:     ${{ secrets.CKAN_API_TOKEN }}
          LAKEFS_ACCESS_KEY:  ${{ secrets.LAKEFS_ACCESS_KEY }}
          LAKEFS_SECRET_KEY:  ${{ secrets.LAKEFS_SECRET_KEY }}
